<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF8F5" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
    <!--
      ===== CUSTOM CODE SLOT (head) =====
      Google Analytics 4 and Microsoft Clarity are already added for every page.
      They load from src/app/wellness/analytics/config.ts ONLY after a visitor
      accepts the cookie banner, so do not paste their snippets here as well.
      Put any other third-party head code below this comment.
      ===== END CUSTOM CODE SLOT =====
    -->
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="oriri-splash" aria-hidden="true">
      <img src="/icon-512.png" alt="" width="112" height="112" />
    </div>
    <style>
      #oriri-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAF8F5;
        transition: opacity 0.45s ease;
      }
      #oriri-splash img {
        width: 112px;
        height: 112px;
        animation: oriri-breathe 1.6s ease-in-out infinite;
      }
      #oriri-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes oriri-breathe {
        0%, 100% { transform: scale(0.94); opacity: 0.75; }
        50% { transform: scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #oriri-splash img { animation: none; }
      }
    </style>
    <script>
      // Safety net: never leave the loading screen up if the app fails to start.
      setTimeout(function () {
        var s = document.getElementById('oriri-splash');
        if (s) s.remove();
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
