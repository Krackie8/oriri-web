    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #F4F1EB;
        color: #4E3B40;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
        width: 100%;
      }
      
      /* Loading screen styles */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #F4F1EB;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-logo {
        font-size: 2.5rem;
        font-weight: 700;
        color: #5A4E46;
        margin-bottom: 2rem;
        text-align: center;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #EDE4DA;
        border-top: 3px solid #D4A19C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        margin-top: 1rem;
        color: #A39589;
        font-size: 0.875rem;
      }
      
      /* Hide loading screen once React loads */
      .app-loaded .loading-screen {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen shown until React app loads -->
      <div class="loading-screen">
        <div class="loading-logo" style="letter-spacing:.32em;font-weight:400">ORIRI</div>
        <div class="loading-spinner"></div>
        <div class="loading-text"></div>
      </div>
    </div>
    
    <script type="module" src="/main.tsx"></script>
    
    <!-- Hide loading screen once DOM is ready -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Add a small delay to ensure smooth transition
        setTimeout(() => {
          document.body.classList.add('app-loaded');
        }, 100);
      });
    </script>
  </body>
