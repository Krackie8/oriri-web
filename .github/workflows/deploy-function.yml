name: Deploy edge function
# Run by hand only (Actions tab -> "Deploy edge function" -> Run workflow).
# Deploys supabase/functions/server from the chosen branch as make-server-a278ea32,
# the name the site calls. Changing it affects the live site, so run it only
# after the change has been approved in the project thread.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lemtlurqzmjdahbhunhz
      FUNCTION: make-server-a278ea32
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Stage the function under its deployed name
        run: |
          mkdir -p supabase/functions/$FUNCTION
          cp -r supabase/functions/server/. supabase/functions/$FUNCTION/
      - name: Deploy
        run: supabase functions deploy $FUNCTION --project-ref $PROJECT_REF --use-api --yes
